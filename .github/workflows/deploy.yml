name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  CF_ACCOUNT_ID: "681f0c5e92719198aa9688776079097e"
  WORKER_NAME: "cro-engine"
  DB_SITES_ID: "80499765-3704-4c5d-ad25-ab88592fb075"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle worker with esbuild
        run: |
          npx --yes esbuild@latest src/worker.js \
            --bundle \
            --format=esm \
            --target=es2022 \
            --outfile=dist/worker.js
          ls -la dist/
          echo "Bundle size: $(wc -c < dist/worker.js) bytes"

      - name: Deploy worker script via Cloudflare API
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
        run: |
          # Build metadata via Node so the SA JSON (quotes + \n) embeds safely as a secret_text binding.
          # GA4_SA delivered as a Worker secret_text (GitHub secret GA4_SA_JSON) because a Google SA key
          # (~2.3KB) exceeds the Cloudflare Secrets Store 1024-char cap. Encrypted at rest; never committed.
          node -e '
            const fs = require("fs");
            const bindings = [
              { type: "plain_text", name: "GA4_MEASUREMENT_ID", text: "G-KQH8EKYZ9L" },
              { type: "secrets_store_secret", name: "GA4_API_SECRET", secret_name: "cro-engine-dbc", store_id: "170e0688af5f479292e0ab52c980eff7" },
              { type: "d1", name: "DB_SITES", database_id: process.env.DB_SITES_ID },
            ];
            if (process.env.GA4_SA_JSON && process.env.GA4_SA_JSON.trim()) {
              bindings.push({ type: "secret_text", name: "GA4_SA", text: process.env.GA4_SA_JSON });
              console.log("GA4_SA binding: attached");
            } else {
              console.log("GA4_SA binding: SKIPPED (GA4_SA_JSON secret empty)");
            }
            const metadata = {
              main_module: "worker.js",
              compatibility_date: "2025-04-01",
              keep_bindings: ["secret_text", "d1", "service", "kv_namespace", "r2_bucket", "secrets_store_secret", "secret_key", "ai"],
              bindings,
            };
            fs.writeFileSync("/tmp/metadata.json", JSON.stringify(metadata));
          '
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/cf-resp.json -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F "worker.js=@dist/worker.js;type=application/javascript+module" \
            -F "metadata=@/tmp/metadata.json;type=application/json")
          echo "HTTP $HTTP_CODE"
          echo "Response body:"
          cat /tmp/cf-resp.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Migrate D1 — CRO tables (idempotent)
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const stmts = fs.readFileSync("schema.sql", "utf8").split(";").map(s => s.trim()).filter(Boolean);
            (async () => {
              for (const sql of stmts) {
                const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/d1/database/${process.env.DB_SITES_ID}/query`, {
                  method: "POST",
                  headers: { Authorization: `Bearer ${process.env.CF_API_TOKEN}`, "Content-Type": "application/json" },
                  body: JSON.stringify({ sql }),
                });
                console.log(r.status, (await r.text()).slice(0, 160));
              }
            })();
          '

      - name: Register daily cron
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '[{"cron":"0 6 * * *"}]' | head -c 300
          echo ""

      - name: Verify critical bindings preserved
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/cf-settings.json \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Bindings settings query failed with HTTP $HTTP_CODE"
            exit 1
          fi
          grep -q '"DB_SITES"' /tmp/cf-settings.json || { echo "::error::D1 DB_SITES binding missing"; exit 1; }
          grep -q '"GA4_SA"' /tmp/cf-settings.json && echo "PASS: GA4_SA (Measure credential) bound" || echo "WARN: GA4_SA not bound — Measure stays dark"
          echo "PASS: critical bindings check complete"

      - name: Smoke test
        run: |
          echo "✓ Deployed via CF API (HTTP 200); collector + CRO engine v1 (read-only)"
          echo "✓ /cro/dreambody.club/report + /run live; daily cron registered"
          echo "✓ Measure switches on when GA4_SA (GA4_SA_JSON) is bound"
